# Two-plane Fresnel knot sorter

dim: 128
pixel_pitch_um: 20.0
wavelength_nm: 780.0
num_output_chans: 2
output_chan_width: 0.20       # mm
circle_radius: 1.0            # mm
channel_sep: 1.5
w0: 0.10                      # mm
LG_modes: [[3, 0], [5, 0]]
gauss_filter_sigma: 500
gaussian_filter_sigma_pixels: 1.28

num_phase_planes: 2
optical_train:
  model: fresnel_lens_train
  optimize_geometry: true
  lens_aperture_radius_mm: 1.0
  padding_factor: 1.0         # set to 2.0 to double the propagation window
  output_coordinate_mode: physical
  geometry_mutation_probability: 0.20
  geometry_mutation_scale: 0.05
  stages:
    - z_to_lens_cm: {initial: 6.0, min: 3.0, max: 6.5}
      focal_length_cm: {initial: 6.0, min: 5.5, max: 10.0}
      z_after_lens_cm: {initial: 6.0, min: 3.0, max: 6.5}
    - z_to_lens_cm: {initial: 6.0, min: 3.0, max: 6.5}
      focal_length_cm: {initial: 6.0, min: 5.5, max: 10.0}
      z_after_lens_cm: {initial: 6.0, min: 3.0, max: 6.5}

rot_angle: '0'
fixedRotation: true
randomRotation: false

num_of_gens: 2.5e5
gen_start: 1.e4
parents_mating: 4
sol_per_pop: 20
crossover_prob: null
mutation_type: adaptive
mutation_percent: 15
mutation_prob: [0.01, 0.0005]
random_mutation_min_val: -0.1
random_mutation_max_val: 0.1
gen_saturate: 20000
parent_c: 1.0
parent_k: 0.5
keep_elitism: 2
random_seed: null

ga_instance: tref_cinque_fresnel_2plane
fitness_func: full
alpha: 1.0
gamma: 1.0

isKnot: true
knotType: [Trefoil, Cinquefoil]
shapeParams: [[0.9, 0.9, 1.0], [2.0, 2.0, 1.0]]
